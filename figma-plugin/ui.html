<!DOCTYPE html>
<html>
<head>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
    padding: 16px;
    background: #ffffff;
    color: #333;
    margin: 0;
  }
  h3 {
    margin-top: 0;
    font-size: 14px;
    color: #0f172a;
    margin-bottom: 12px;
  }
  textarea {
    width: 100%;
    height: 220px;
    padding: 10px;
    margin-bottom: 16px;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    font-family: monospace;
    font-size: 11px;
    resize: none;
    box-sizing: border-box;
  }
  textarea:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 1px #3b82f6;
  }
  button {
    background: #0f172a;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
    width: 100%;
    transition: background 0.2s;
  }
  button:hover {
    background: #1e293b;
  }
  button:disabled {
    background: #94a3b8;
    cursor: not-allowed;
  }
  #status {
    margin-top: 12px;
    font-size: 11px;
    color: #64748b;
    text-align: center;
    min-height: 16px;
  }
</style>
</head>
<body>

<h3>Project Pack Data Sync</h3>
<textarea id="payload" placeholder="Paste the JSON payload from the Web App..."></textarea>
<button id="sync">Sync to Template</button>
<div id="status"></div>

<script>
  const statusEl = document.getElementById('status');
  const syncBtn = document.getElementById('sync');

  syncBtn.onclick = async () => {
    const text = document.getElementById('payload').value;
    
    if (!text.trim()) {
      statusEl.innerText = "Please paste JSON data first.";
      return;
    }
    
    try {
      const data = JSON.parse(text);
      syncBtn.disabled = true;
      statusEl.innerText = "Processing JSON Data...";
      
      const processedData = { ...data };
      
      // Image URLs are passed as plain strings.
      // code.js has networkAccess and fetches images directly in the plugin sandbox.
      statusEl.innerText = "Sending to Figma...";
      parent.postMessage({ pluginMessage: { type: 'sync-data', data: processedData } }, '*');
      
    } catch (e) {
      statusEl.innerText = "Syntax Error: Invalid JSON structure.";
      syncBtn.disabled = false;
      console.error(e);
    }
  };

  onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (msg && msg.type === 'status') {
      statusEl.innerText = msg.message;
      syncBtn.disabled = false;
    }
  };
</script>

</body>
</html>
